version: "2"

linters:
  default: fast
  disable:
    - wsl
  enable:
    - wsl_v5
  settings:
    cyclop:
      max-complexity: 12
    funlen:
      lines: 80
      statements: 50
    depguard:
      rules:
        main:
          list-mode: lax
          allow:
            - $gostd
            - github.com/romantelychko/coverage-tree
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
